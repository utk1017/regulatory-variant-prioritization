# HBB regulatory-evidence pipeline configuration.
gene_symbol: "HBB"
canonical_transcript: "ENST00000335295"
flank_bp: 100000
promoter_window_bp: 2500

# Layer 0 Configuration
layer0:
  run_layer0: false                   # true = rebuild the candidate set from ClinVar + Ensembl VEP + ENCODE cCREs (needs internet, apt, pip)
  canonical_transcript: "ENST00000335295"
  promoter_window_bp: 2500
  clinvar_snapshot_date: "20261019"   # pinned for reproducibility; null = auto-discover the newest snapshot
  clinvar_snapshot_note: "date reported by the original Layer 0 run; not verifiable from the CSV itself"
  vep_batch_size: 200
  vep_timeout_s: 30
  vep_max_retries: 3

# Layer 1 Configuration
layer1:
  use_http_cache: true
  http_cache_dir: "data/cache/http"
  cache_ttl_days: 7
  refresh_cache: false
  strict: false
  gtex_dataset: "gtex_v8"
  gtex_gencode_version: "v26"
  gtex_tissues:
    - "Whole_Blood"
  gtex_items_per_page: 250
  gtex_max_pages: 40
  eqtl_testable_min_maf: 0.01
  gwas_p_threshold: 5.0e-8
  gwas_source: "auto"                 # auto = REST API first, official bulk file if the API fails | api | download
  gwas_download_url: "https://ftp.ebi.ac.uk/pub/databases/gwas/releases/latest/gwas-catalog-associations_ontology-annotated-full.zip"
  gwas_download_ttl_days: 14
  gwas_window_bp: 25000
  gnomad_dataset: "gnomad_r4"
  gnomad_window_bp: 25000
  gnomad_request_delay_s: 6.0
  mpra_evidence_path: "data/inputs/hbb_locus_mpra_evidence.csv"
  crispr_evidence_path: null
  sig_pvalue_threshold: 0.05

# Layer 2 Configuration
layer2:
  target_tissues:
    - "Whole_Blood"
  target_cell_types:
    - "HEL92.1.7"                     # erythroid; matches the cell_type in MPRA table
  halt_on_query_failure: true         # stop before writing Layer 2 outputs if any evidence query failed
  tier_thresholds:
    tier_1_min_modalities: 2
    tier_2_modalities: 1
    tier_3_modalities: 0
  strict: false
